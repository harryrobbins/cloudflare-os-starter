<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tessera harness</title>
  <style>
    html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; }

    <a href="?procgen=1">with PROCGEN</a>

  <div id="pane"></div>
  <script type="module" src="/harness/parent.js"></script>

</html>
