name: records-next
services:
  db:
    image: postgres:17@sha256:0027bef26712baaee437a4ea48fdf3d2d2e2bc5f0d81615374408ca320f3c7e3
    environment:
      POSTGRES_DB: records
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run dev:prepare first}
    volumes:
      - records-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d records"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [private]
  init:
    image: node:24.19.0-bookworm-slim@sha256:a9f5f7c91a432850b2a8a7797adf5eadb6c733ceed61167806cee7ea7fbc29df
    user: "1000:1000"
    working_dir: /workspace/packages/records-service
    command: [node, scripts/local-init.ts]
    env_file: .eval/compose.env
    volumes: &source
      - .:/workspace/packages/records-service:ro
      - ../records-model:/workspace/packages/records-model:ro
      - ../../node_modules:/workspace/node_modules:ro
    depends_on:
      db: { condition: service_healthy }
    networks: [private]
  postgrest:
    image: postgrest/postgrest:v16.4@sha256:d155c6718ed9a9f990d159a2ab7c0a3f16944dbb6d0a0344557421042acfe0df
    environment:
      PGRST_DB_URI: ${PGRST_DB_URI:?Run dev:prepare first}
      PGRST_DB_SCHEMAS: records_api
      PGRST_DB_PRE_REQUEST: records_api.pre_request
      PGRST_JWT_SECRET: "@/config/jwks.json"
      PGRST_JWT_AUD: records
      PGRST_DB_MAX_ROWS: "500"
      PGRST_DB_POOL: "10"
    volumes:
      - ./.eval/jwks.json:/config/jwks.json:ro
    depends_on:
      init: { condition: service_completed_successfully }
    networks: [private]
  gateway:
    image: node:24.19.0-bookworm-slim@sha256:a9f5f7c91a432850b2a8a7797adf5eadb6c733ceed61167806cee7ea7fbc29df
    user: "1000:1000"
    working_dir: /workspace/packages/records-service
    command: [node, src/server.ts]
    environment:
      RECORDS_AUTH_DATABASE_URL: ${RECORDS_AUTH_DATABASE_URL:?Run dev:prepare first}
      RECORDS_LISTENER_DATABASE_URL: ${RECORDS_LISTENER_DATABASE_URL:?Run dev:prepare first}
      RECORDS_SIGNING_KID: ${RECORDS_SIGNING_KID:?Run dev:prepare first}
      POSTGREST_URL: http://postgrest:3000
      RECORDS_SIGNING_KEY_FILE: /workspace/packages/records-service/.eval/signing.pem
      RECORDS_HOST: 0.0.0.0
      RECORDS_PORT: "8788"
    # Runtime never sees owner credentials, operator fixtures or migration scripts.
    volumes:
      - ./package.json:/workspace/packages/records-service/package.json:ro
      - ./src:/workspace/packages/records-service/src:ro
      - ./node_modules:/workspace/packages/records-service/node_modules:ro
      - ../records-model:/workspace/packages/records-model:ro
      - ../../node_modules:/workspace/node_modules:ro
      - ./.eval/signing.pem:/workspace/packages/records-service/.eval/signing.pem:ro
    ports: ["127.0.0.1:8788:8788"]
    depends_on:
      init: { condition: service_completed_successfully }
      postgrest: { condition: service_started }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8788/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private, edge]
  operator:
    profiles: [tools]
    image: node:24.19.0-bookworm-slim@sha256:a9f5f7c91a432850b2a8a7797adf5eadb6c733ceed61167806cee7ea7fbc29df
    user: "1000:1000"
    working_dir: /workspace/packages/records-service
    command: [node, --version]
    env_file: .eval/compose.env
    environment:
      POSTGREST_URL: http://postgrest:3000
      RECORDS_SIGNING_KEY_FILE: /workspace/packages/records-service/.eval/signing.pem
    volumes: *source
    networks: [private]
networks:
  edge: {}
  private:
    internal: true
volumes:
  records-data:
