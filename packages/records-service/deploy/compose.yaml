name: records-server
x-runtime: &runtime
  image: ${RECORDS_IMAGE:-records-server:local}
  build:
    context: ../../../..
    dockerfile: packages/records-service/Dockerfile
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  tmpfs: ["/tmp:size=16m,mode=1777"]
  networks: [database]
services:
  db:
    image: postgres:17@sha256:0027bef26712baaee437a4ea48fdf3d2d2e2bc5f0d81615374408ca320f3c7e3
    environment:
      POSTGRES_DB: records
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [records-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d records"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [database]
  migrate:
    <<: *runtime
    command: [node, deploy/migrate.ts]
    healthcheck: {disable: true}
    secrets: [postgres_password, authenticator_password, gateway_password, listener_password]
    depends_on:
      db: {condition: service_healthy}
  postgrest:
    image: postgrest/postgrest:v16.4@sha256:d155c6718ed9a9f990d159a2ab7c0a3f16944dbb6d0a0344557421042acfe0df
    command: [postgrest, /run/secrets/postgrest_config]
    secrets: [postgrest_config, jwks]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [database]
  gateway:
    <<: *runtime
    environment:
      RECORDS_AUTH_DATABASE_URL_FILE: /run/secrets/gateway_database_url
      RECORDS_LISTENER_DATABASE_URL_FILE: /run/secrets/listener_database_url
      RECORDS_SIGNING_KEY_FILE: /run/secrets/signing_key
      RECORDS_SIGNING_KID_FILE: /run/secrets/signing_kid
      POSTGREST_URL: http://postgrest:3000
      RECORDS_HOST: 0.0.0.0
      RECORDS_PORT: '8788'
    secrets: [gateway_database_url, listener_database_url, signing_key, signing_kid]
    ports: ["127.0.0.1:${RECORDS_LOCAL_PORT:-8789}:8788"]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgrest: {condition: service_started}
    networks: [database, ingress]
volumes:
  records-data:
networks:
  database: {internal: true}
  ingress:
secrets:
  postgres_password: {file: '${RECORDS_SECRETS_DIR:?Set an absolute deployment secret directory}/postgres_password'}
  authenticator_password: {file: '${RECORDS_SECRETS_DIR}/authenticator_password'}
  gateway_password: {file: '${RECORDS_SECRETS_DIR}/gateway_password'}
  listener_password: {file: '${RECORDS_SECRETS_DIR}/listener_password'}
  gateway_database_url: {file: '${RECORDS_SECRETS_DIR}/gateway_database_url'}
  listener_database_url: {file: '${RECORDS_SECRETS_DIR}/listener_database_url'}
  signing_key: {file: '${RECORDS_SECRETS_DIR}/signing.pem'}
  signing_kid: {file: '${RECORDS_SECRETS_DIR}/signing_kid'}
  jwks: {file: '${RECORDS_SECRETS_DIR}/jwks.json'}
  postgrest_config: {file: '${RECORDS_SECRETS_DIR}/postgrest.conf'}
